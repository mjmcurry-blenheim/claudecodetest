<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather App</h1>
            <p>Get current weather information for any city</p>
        </header>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name..." />
            <button id="searchBtn">Search</button>
        </div>

        <div id="apiKeySection" class="api-key-section">
            <p>Please enter your OpenWeatherMap API key:</p>
            <input type="text" id="apiKeyInput" placeholder="Enter API key..." />
            <button id="saveApiKeyBtn">Save API Key</button>
            <p class="api-help">
                Don't have an API key?
                <a href="https://openweathermap.org/api" target="_blank">Get one free here</a>
            </p>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="weatherDisplay" class="weather-display hidden">
            <div class="location">
                <h2 id="cityName"></h2>
                <p id="country"></p>
            </div>

            <div class="current-weather">
                <div class="temperature">
                    <span id="temp" class="temp-value"></span>
                    <span class="temp-unit">°C</span>
                </div>
                <div class="weather-icon">
                    <img id="weatherIcon" src="" alt="Weather icon">
                </div>
                <div class="weather-description">
                    <p id="description"></p>
                </div>
            </div>

            <div class="weather-details">
                <div class="detail-item">
                    <span class="label">Feels Like</span>
                    <span id="feelsLike" class="value"></span>
                </div>
                <div class="detail-item">
                    <span class="label">Humidity</span>
                    <span id="humidity" class="value"></span>
                </div>
                <div class="detail-item">
                    <span class="label">Wind Speed</span>
                    <span id="windSpeed" class="value"></span>
                </div>
                <div class="detail-item">
                    <span class="label">Pressure</span>
                    <span id="pressure" class="value"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
